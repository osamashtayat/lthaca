<html lang="en">
<body style="margin:0;padding:24px;background:#F8F5EC;color:#242321;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5">
  <p>Hi {{displayName}},</p>
  <p>Someone asked to reset the password for your Ithaca account. To choose a new one:</p>
