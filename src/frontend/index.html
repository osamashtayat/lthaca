<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F5EC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Ithaca: pick a movie, alone or with friends</title>
    <meta name="description" content="Swipe a deck of films, or open a room with a share link and let your friends vote until you all agree on one." />
    <!-- Link previews (WhatsApp, iMessage, ...). Crawlers don't run JS, so these are static and site-wide;
         per-room and per-film tags are injected by the Cloudflare Worker (ADR-0030). og:image must be absolute. -->
    <meta property="og:site_name" content="Ithaca" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ithaca: pick a movie, alone or with friends" />
    <meta property="og:description" content="Swipe a deck of films, or open a room with a share link and let your friends vote until you all agree on one." />
    <meta property="og:image" content="https://ithacamovies.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ithaca: swipe your way to tonight's movie" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
