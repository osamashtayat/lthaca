# Production deploy (ADR-0030; docs/deployment.md). Order: API (migrations first) → Worker → site.
#   push to main        build, then wait for a manual approval (GitHub environment `production`), then deploy
#   workflow_dispatch   deploy any commit of main again: the rollback (docs/deployment.md → Rollback)
#   pull_request        a Pages preview of the SPA (UI only: previews have no API, ADR-0030 §1)
# Every job is skipped until its settings exist (repository variables, docs/deployment.md step 5), so this workflow
# stays green before the server and Cloudflare are set up.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit of main to deploy (a rollback); empty = the latest main"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Production deploys queue (never cancelled half-way); previews cancel their older run.
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.ref) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER: wrangler@4.156.0
  SENTRY_CLI: "@sentry/cli@3.8.2"

jobs:
  meta:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: sha
        name: Commit to deploy (must be on main, except previews)
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  site-build:
    name: Build the site
    needs: meta
    if: vars.PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    env:
      SHA: ${{ needs.meta.outputs.sha }}
      # Previews don't report to Sentry; production builds do (ADR-0028).
      VITE_SENTRY_DSN: ${{ github.event_name != 'pull_request' && vars.VITE_SENTRY_DSN || '' }}
      VITE_SENTRY_RELEASE: ithaca-frontend@${{ needs.meta.outputs.sha }}
      SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_URL: https://de.sentry.io/
      SENTRY_ORG: osama-vz
      SENTRY_PROJECT: ithaca-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      # `npm run build` (package.json) with hidden source maps: the bundle has no sourceMappingURL, the maps go to Sentry.
      - name: Build (hidden source maps)
        run: npx tsc -b && npx vite build --sourcemap hidden && node scripts/check-no-mocks.mjs
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx --yes "$SENTRY_CLI" sourcemaps inject dist
          npx --yes "$SENTRY_CLI" sourcemaps upload --release "$VITE_SENTRY_RELEASE" dist
      - name: Remove the maps, add the Pages headers
        run: |
          find dist -name '*.map' -delete
          cp ../../deploy/pages/_headers dist/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: src/frontend/dist
          retention-days: 7

  site-preview:
    name: Pages preview (UI only)
    needs: site-build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy the preview
        # Values from the event go through env, never straight into the script (branch names are user input).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes "$WRANGLER" pages deploy dist --project-name "$PAGES_PROJECT" --branch "$BRANCH" --commit-hash "$HEAD_SHA"

  api-images:
    name: Build and push the API images
    needs: meta
    if: github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      ITHACA_TAG: ${{ needs.meta.outputs.sha }}
      POSTGRES_PASSWORD: build-only-not-used
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - name: Build and push (ghcr.io, private)
        run: |
          set -euo pipefail
          export ITHACA_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose -f docker-compose.prod.yml build migrate api
          docker compose -f docker-compose.prod.yml push migrate api

  deploy-api:
    name: Deploy the API (VPS)
    needs: [meta, api-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual approval: the `production` environment requires a reviewer (docs/deployment.md step 5).
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.meta.outputs.sha }}
      HOST: ${{ vars.DEPLOY_HOST }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false
      - name: SSH key and host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull, migrate, start (docker compose on the server)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The commit, registry and actor expand here, on the runner, on purpose (all trusted values).
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          scp -q docker-compose.prod.yml "deploy@$HOST:/opt/ithaca/docker-compose.prod.yml"
          # The registry token goes over stdin, never on a command line or into the logs.
          printf '%s' "$GHCR_TOKEN" | ssh "deploy@$HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null"
          ssh "deploy@$HOST" "set -e; cd /opt/ithaca
            export ITHACA_REGISTRY='$registry' ITHACA_TAG='$SHA'
            trap 'docker logout ghcr.io >/dev/null' EXIT
            docker compose -f docker-compose.prod.yml pull --quiet migrate api
            docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 300
            [ -f DEPLOYED ] && cp DEPLOYED PREVIOUS || true
            echo '$SHA' > DEPLOYED
            docker compose -f docker-compose.prod.yml ps"
      - name: Ready through Cloudflare
        if: vars.SITE_URL != ''
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$SITE_URL/api/health/ready"

  deploy-worker:
    name: Deploy the Worker
    needs: [meta, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: npx --yes "$WRANGLER" deploy --message "$SHA"

  deploy-site:
    name: Deploy the site (Pages)
    needs: [meta, site-build, deploy-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      SHA: ${{ needs.meta.outputs.sha }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: wrangler pages deploy
        run: npx --yes "$WRANGLER" pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$SHA"
      - name: Smoke through the domain
        if: vars.SITE_URL != ''
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$SITE_URL/" | grep -qi '<div id="root"'
          curl -fsS "$SITE_URL/api/health" | grep -q '"status":"ok"'
