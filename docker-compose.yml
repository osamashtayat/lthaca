# Copy .env.example to .env first (placeholders only, never real secrets). Then:
#   docker compose up --build        full stack: db, migrations, api, web on http://localhost:8080
#   docker compose up -d db          PostgreSQL + pgvector only, for `dotnet run` + `npm run dev`
name: ithaca

# Every container's console log rotates (ADR-0028): at most 5 × 10 MB each, so logs can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  ConnectionStrings__Ithaca: "Host=db;Port=5432;Database=${POSTGRES_DB:-ithaca};Username=${POSTGRES_USER:-ithaca};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}"

services:
  db:
    # PostgreSQL with the pgvector extension available (ADR-0002); the initial migration runs CREATE EXTENSION.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ithaca}
      POSTGRES_USER: ${POSTGRES_USER:-ithaca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ithaca-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the EF Core migrations and exits. The API starts only after it succeeded.
  migrate:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      target: migrations
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      target: api
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *api-environment
      ASPNETCORE_ENVIRONMENT: ${ITHACA_ENVIRONMENT:-Development}
      Ai__LlmProvider: ${Ai__LlmProvider:-Fake}
      Ai__LlmModel: ${Ai__LlmModel:-claude-opus-5-5}
      Ai__ApiKey: ${Ai__ApiKey:-}
      Ai__EmbeddingProvider: ${Ai__EmbeddingProvider:-Fake}
      Ai__EmbeddingApiKey: ${Ai__EmbeddingApiKey:-}
      Tmdb__Client: ${Tmdb__Client:-Fake}
      Tmdb__ApiKey: ${Tmdb__ApiKey:-}
      Wikidata__Client: ${Wikidata__Client:-Fake}
      Email__Provider: ${Email__Provider:-Fake}
      Email__ApiKey: ${Email__ApiKey:-}
      Email__SiteUrl: ${Email__SiteUrl:-http://localhost:8080}
      CatalogSync__Enabled: ${CatalogSync__Enabled:-false}
      CatalogSync__Pages: ${CatalogSync__Pages:-50}
      CatalogSync__EmbeddingBatchSize: ${CatalogSync__EmbeddingBatchSize:-100}
      # Error tracking (ADR-0028): empty = off. Sentry__Release names the deploy (OPS-07).
      Sentry__Dsn: ${Sentry__Dsn:-}
      Sentry__Release: ${Sentry__Release:-}
    # Ready = the API answers and reaches the database. The runtime image has no curl, so the API probes itself.
    healthcheck:
      test: ["CMD", "dotnet", "Ithaca.Api.dll", "--probe-ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No `ports:`: only the web proxy reaches the API (same origin, no CORS).
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: web
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${ITHACA_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ithaca-db:
